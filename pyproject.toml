[project]
name = "swiggy-hunter"
version = "2.0.0"
description = "Autonomous stealth AI scanner — swiggy.com business-logic hunter"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9",
  "curl-cffi>=0.7",
  "playwright>=1.44",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "python-telegram-bot>=21.0",
  "structlog>=24.1",
  "tenacity>=8.2",
  "cryptography>=42.0",
  "httpx[http2]>=0.27",
  "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.9",
]

[project.scripts]
swiggy-hunter = "swiggy_hunter.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
